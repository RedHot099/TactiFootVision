[project]
name = "tactifoot-vision"
version = "0.2.0"
description = "Football video analysis toolkit: dataset preparation, augmentation, model training, inference and visualisation."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<4.0"
authors = [
    { name = "Jakub Eichner", email = "redhotdevil996@gmail.com" }
]
dependencies = [
    "numpy>=1.23.0,<=2.1.1",
    "ultralytics>=8.3.98,<9.0.0",
    "pydantic>=2.11.0,<3.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "supervision>=0.25.1,<0.26.0",
    "opencv-python-headless>=4.11.0.86,<5.0.0",
    "torch>=2.6.0,<3.0.0",
    "torchvision>=0.21.0,<0.22.0",
    "rfdetr>=1.0.8,<2.0.0",
    "tqdm>=4.67.1,<5.0.0",
    "pyarrow>=19.0.1,<20.0.0",
    "transformers>=4.48.0,<5.0.0",
    "umap-learn>=0.5.7,<0.6.0",
    "scikit-learn>=1.5.2,<1.6.0",
    "pandas>=2.2.0,<3.0.0",
    "pillow>=10.0.1,<11.0.0",
    "matplotlib>=3.10.1,<4.0.0",
]

[project.optional-dependencies]
# The SAM2 tracker also needs https://github.com/Gy920/segment-anything-2-real-time
# cloned to external/ (it is not pip-installable).
sam2 = ["hydra-core>=1.3.2", "iopath>=0.1.10"]

[project.scripts]
tactifoot = "tactifoot_vision.cli:main"

[dependency-groups]
dev = [
    "ipykernel>=6.29.5,<7.0.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "pytest>=8.3.0",
    "ruff>=0.11.2,<0.12.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tactifoot_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model'"
markers = [
    "model: needs real model weights and/or a GPU (run with -m model)",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
