[project]
name = "tactifoot-vision"
version = "0.2.0"
description = "Football video analysis: detection, tracking, team classification and pitch homography, from dataset preparation to tactical maps."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
authors = [
    { name = "Jakub Eichner", email = "redhotdevil996@gmail.com" }
]
keywords = ["football", "soccer", "computer-vision", "object-detection", "tracking", "homography", "sports-analytics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Multimedia :: Video",
]
# The core runs the default preset: YOLO detection and pitch keypoints,
# ByteTrack, SigLIP teams (transformers, umap-learn), the roles post-process
# (scikit-learn).
# Lower bounds are the locked versions; upper bounds only at the next major of
# the libraries with a history of breaking changes. The ranges must resolve on
# the default Google Colab runtime without downgrading anything it ships
# (tests/colab-constraints.txt, checked by scripts/colab-smoke.sh).
dependencies = [
    "numpy>=2.1,<3",
    "ultralytics>=8.3.98,<9",
    "pydantic>=2.11,<3",
    "pyyaml>=6.0.2",
    "supervision>=0.25.1,<0.26",  # 0.26 removed sv.ByteTrack (moved to the trackers library)
    "opencv-python>=4.11",  # what ultralytics and supervision pull too
    "torch>=2.6,<3",
    "torchvision>=0.21",
    "tqdm>=4.67",
    "pyarrow>=19",  # pandas parquet engine (PipelineResult.to_parquet)
    "scipy>=1.15",
    "transformers>=4.48,<6",
    "umap-learn>=0.5.7",
    "scikit-learn>=1.5.2",
    "pandas>=2.2",
    "pillow>=10",
    "matplotlib>=3.10",
]

# Optional backends; a missing one says which extra to install (utils.require_extra).
[project.optional-dependencies]
# RF-DETR detector. 1.4+ pins supervision>=0.29 and transformers>=5 and changes
# the internals this backend uses; upgrading is its own ticket.
rfdetr = ["rfdetr>=1.3.0,<1.4", "transformers<5"]  # 1.3 imports transformers 4 internals
# The SAM2 tracker also needs https://github.com/Gy920/segment-anything-2-real-time
# cloned to external/ (it is not pip-installable).
sam2 = ["hydra-core>=1.3.2", "iopath>=0.1.10"]
all = ["tactifoot-vision[rfdetr]"]

[project.urls]
Homepage = "https://github.com/RedHot099/TactiFootVision"
Repository = "https://github.com/RedHot099/TactiFootVision"
Issues = "https://github.com/RedHot099/TactiFootVision/issues"
Changelog = "https://github.com/RedHot099/TactiFootVision/releases"

[project.scripts]
tactifoot = "tactifoot_vision.cli:main"

[dependency-groups]
dev = [
    "hatchling>=1.24.0",
    "ipykernel>=6.29.5,<7.0.0",
    "nbclient>=0.10.0",
    "nbformat>=5.10.0",
    "pytest>=8.3.0",
    "ruff>=0.11.2,<0.12.0",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
only-include = ["src/tactifoot_vision", "README.md", "LICENSE", "pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/tactifoot_vision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not model'"
markers = [
    "model: needs real model weights and/or a GPU (run with -m model)",
]

[tool.ruff]
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
