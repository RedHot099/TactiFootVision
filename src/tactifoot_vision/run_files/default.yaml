# Run file: how `tactifoot run` processes video (YOLO detector, ByteTrack, SigLIP teams).
# Written by `tactifoot init`; edit it, or override one value per run with --set.
#
#   CLI:      tactifoot run pipeline.yaml --video match.mp4 --output-dir outputs/match \
#                 --end 500 --set detector.conf=0.4
#   Notebook: no run file, the same objects in plain Python:
#               pipeline = tv.Pipeline(
#                   detector=tv.load_model("yolo", "detector_yolo11l.pt", conf=0.3, iou=0.5),
#                   line_model=tv.load_model("lines", "pitch_lines.pt"),
#                   tracker=tv.tracking.create_tracker("bytetrack", lost_track_buffer=30),
#                   team_classifier=tv.teams.TeamClassifier(embedder="siglip"),
#               )
#               result = pipeline.run("match.mp4", end=500)
#               tv.viz.render_video(result, "match.mp4", "outputs/match/annotated.mp4")
#   Both:     tv.run_file.load("pipeline.yaml").run("match.mp4", "outputs/match", end=500)
#
# Each section's keys are the keyword arguments of one package call (see
# docs/ARCHITECTURE.md, "Run files"); a key left out keeps the package default.
# Weights are a path to a checkpoint (bare names resolve in the current
# directory; ./ and ../ are relative to this file) or a name Ultralytics
# publishes, such as yolo11n.pt, downloaded once. No football weights ship
# with the package: train your own (tactifoot train; the line model with
# tactifoot train lines --calibration ... --gamestate ...) or point at yours.

detector:                   # tv.load_model(type, weights, **rest)
  type: yolo                # yolo | rfdetr  (tactifoot info)
  weights: detector_yolo11l.pt
  conf: 0.3
  iou: 0.5

lines:                      # tv.load_model(type, weights, **rest); null: no homography,
  type: lines               # no pitch positions
  weights: pitch_lines.pt

tracker:                    # tv.tracking.create_tracker(type, **rest); null: no tracking
  type: bytetrack           # bytetrack | sam2
  lost_track_buffer: 30

teams:                      # tv.teams.TeamClassifier(**teams); null: no teams
  embedder: siglip          # siglip | resnet

# pitch: {length: 120, width: 80}      # tv.SoccerPitch(...): StatsBomb units
# homography: {max_age_s: 1.0}         # tv.pitch.HomographyEstimator(pitch, ...); its
#                                      # temporal_filter settings also steer
#                                      # smooth_homographies below (null: no filter, and
#                                      # smooth_homographies keeps the per-frame homographies)
# pipeline:                            # remaining tv.Pipeline(...) arguments
#   include_classes: [player, goalkeeper]
# postprocess:                         # tv.pipeline.POSTPROCESSES, applied in order
#   - {type: smooth_homographies}      # first: homographies smoothed over the whole video
#   - {type: join_tracks, max_gap: 1.6}  # join tracks into player tracks
#   - {type: track_ball, max_gap: 0.5}  # choose the ball among the candidates
#   - {type: assign_roles}             # goalkeepers, referees, people off the pitch
# render:                              # tv.viz.render_video(...) arguments
#   annotator: {style: video_game}     # tv.viz.FrameAnnotator(...)
#   radar: {draw_ids: true}            # tv.viz.PitchRadar(...); null: no radar
#   overlay_position: bottom-right
