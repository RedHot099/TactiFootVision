# Sources of every number in REPORT.md (detector-data 06). Checked by scripts/check_report.py; see its docstring.
# Relative paths are relative to the repository; result folders on /mnt/storage and in the main checkout are absolute.
# Folders with dev = true hold the choice on development data (GSR valid, Ekstraklasa dev, valid placement, and the
# xg-detector audits, Data: StatsBomb); folders with confirmatory = true hold the single GSR test read (ticket 05).

[report]
dev_label = "wyniki rozwojowe"
confirmatory_label = "wynik testu"
# Design constants and names, not results: input sizes and frame formats, the 5 m / 30 m placement thresholds,
# the 8K / v3D / CC BY 4.0 names, the 172 held-out xG matches, the year of the GSR league, the not-file-backed
# figures quoted in code spans are skipped as code.
untagged = ["640 px", "1280 px", "1280", "640", "720p", "1080p", "1920", "16:9", "11m", "11l", "404", "95%", "400 ms", "SHA-256", "5 m", "30 m", "8K", "CC BY 4.0", "CC BY-NC 4.0", "172 meczach"]

