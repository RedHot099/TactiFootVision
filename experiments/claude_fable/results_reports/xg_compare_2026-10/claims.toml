# Sources of every number in REPORT.md (xg-compare 03), the report of the xg-compare phase.
# Checked by scripts/check_xgd_audit.py (which runs scripts/check_vendor_report.py); see both docstrings.
# Paths are relative to experiments/claude_fable. "alias:file" resolves through [folders].
# The whole study is exploratory (the labels were joined before by the xg-vendor confirmatory run), so no folder is
# marked dev or confirmatory: the report states the status in its text and tags every claim with its tier there.
# The recovery folder (rc) holds descriptive numbers added after the run (scripts/xgc_recovery.py, ticket 03).

[report]
# Design constants and names, not results: the -400 ms frame offset and its method name, StatsBomb distance and
# goal-mouth-angle bin labels (the category dictionary of the protocol), the protocol's item numbers 13 written out,
# the hash name in the source table.
untagged = ["F−400", "400 ms", "25+", "18–25", "12–18", "0–15°", "15°", "Pozycja 13", "SHA-256"]

[folders]
an = { path = "results/xgc_compare/analysis" }
rc = { path = "results/xgc_compare/recovery" }

[claims]

