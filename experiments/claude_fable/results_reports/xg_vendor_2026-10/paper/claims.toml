# Numbers of the xg-vendor paper draft (xg-vendor 17), checked by scripts/check_vendor_paper.py.
# Each entry names a claim of the report's claims.toml (`from`, default: the same id) and may override only
# `fmt` (English number style) and `labels`; source, locator and the confirmatory/development flag stay the report's.

[paper]
report = "results_reports/xg_vendor_2026-10/REPORT.md"
tex = ["main.tex", "supp.tex"]
confirmatory_label = "confirmatory results"
dev_label = "development results"
# Design constants fixed by the pre-registration, as in the report: the -400 ms frame offset, the +-200 ms residual
# restriction and the 40 ms early/late threshold of H4 (exact LaTeX spellings); "SHA-256" names the hash.
untagged = ['$-400$\,ms', '$400$\,ms', '$\pm200$\,ms', '40\,ms', 'SHA-256']

