# Sources of every number in REPORT.md (xg-vendor 16).
# Checked by scripts/check_vendor_report.py (which runs scripts/check_reviewer_report.py); see both docstrings.
# Paths are relative to experiments/claude_fable. "alias:file" resolves through [folders].
# confirmatory = true: results of the single confirmatory run; dev = true: development numbers.

[report]
dev_label = "wyniki rozwojowe"
confirmatory_label = "wyniki konfirmacyjne"
# Design constants fixed by the pre-registration and the timing rule; tagged where first stated, free afterwards:
# the +-200 ms residual restriction, the -400 ms frame offset and the 40 ms early/late threshold of H4;
# "SHA-256" is the name of the hash in the source table.
untagged = ["±200 ms", "400 ms", "40 ms", "SHA-256"]

[folders]
cf = { path = "results/xgv_confirmatory", confirmatory = true }
cfl = { path = "results/xgv_confirmatory/ladder", confirmatory = true }
cfp = { path = "results/xgv_confirmatory/probes", confirmatory = true }
cfk = { path = "results/xgv_confirmatory/leakage", confirmatory = true }
run = { path = "results/xgv_confirmatory" }   # protocol facts of the run (parameters, hashes), not results
pa = { path = "results/xgv_pairing" }
ti = { path = "results/xgv_timing_source" }
gc = { path = "results/xgv_g_combo" }
co = { path = "results/xgv_comparator" }
sp = { path = "results/xgv_split_plan" }
rs = { path = "results" }
res = { path = "research" }
pw = { path = "results/xgv_power", dev = true }
ld = { path = "results/xgv_ladder_dev", dev = true }
pd = { path = "results/xgv_probes_dev", dev = true }
rc = { path = "results/xgv_refit_check", dev = true }

[claims]
# Constants quoted from the pre-registration.
"pg.ci95" = { src = "res:xg_vendor_preregistration.md", quote = "Raportujemy przedziały 95%", values = [95], fmt = "{:d}%" }
"pg.ci90" = { src = "res:xg_vendor_preregistration.md", quote = "czyli gdy przedział 90% mieści się w (−d, d)", values = [90], fmt = "{:d}%" }
"pg.alpha" = { src = "res:xg_vendor_preregistration.md", quote = "H2 to jeden test TOST na poziomie 5% na stronę", values = [5], fmt = "{:d}%" }
"pg.bonf" = { src = "res:xg_vendor_preregistration.md", quote = "Każdy rozstrzyga jednostronny test na poziomie 2,5%", values = [2.5], fmt = "{:.1f}%" }
"pg.code_files" = { src = "res:xg_vendor_preregistration.md", quote = "Kod analizy (32 plików)", values = [32], fmt = "{:d}" }
"pg.corner_margin" = { src = "res:xg_vendor_preregistration.md", quote = "Margines rogów nad progiem 0,80 w teście źródła czasu jest cienki (0,021)", values = [0.021], fmt = "{:.3f}" }
"pg.nf_matches" = { src = "res:xg_vendor_preregistration.md", quote = "Leżą w 86 meczach", values = [86], fmt = "{:d}" }
"pg.recovered_pen" = { src = "res:xg_vendor_preregistration.md", quote = "Karne populacji wtórnej to 7 odzyskanych goli", values = [7], fmt = "{:d}" }
"pg.near" = { src = "res:xg_vendor_preregistration.md", quote = "leżą w odległości do 0,02 od progu", values = [0.02], fmt = "{:.2f}" }

# Protocol facts of the confirmatory run (its completion record and label-join record).
"run.n_boot" = { src = "run:complete.json", keys = ["identity.prereg.n_boot"], fmt = "{:,d}" }
"run.delta" = { src = "run:complete.json", keys = ["identity.prereg.margin"], fmt = "{:.3f}" }
"run.gate_thr" = { src = "run:complete.json", keys = ["identity.prereg.h3_control_max_r2"], fmt = "{:.3f}" }
"run.prereg_sha" = { src = "run:label_join_log.jsonl", keys = ["prereg_sha256"], fmt = "{:.12}" }

