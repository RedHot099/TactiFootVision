# Sources of every number in REPORT.md (sweep report, 2026-10-22): the method sweep on the 172 held-out matches
# (2026-10-18) and the feet_t0 shot-location follow-up (2026-10-22). Both are descriptive readings, not tests.
# Checked by: ./run.sh --no-sync python scripts/check_xgd_audit.py results_reports/sweep_2026_10/REPORT.md
# Paths are relative to experiments/claude_fable. "alias:file" resolves through [folders].
# No folder is confirmatory: nothing in this report is a test result. The development read-outs on the 328 training
# matches (d0-d3, and the paired feet - dd2c development deltas) stand under a "wyniki rozwojowe" heading.
# results/sweep_report is flattened by scripts/sweep_report.py from existing files only (no fit, no label read); it
# also holds a verbatim copy of the err-decomp decision-log row, the only file record of the feet vendor-gap share.
# Every StatsBomb-derived number stands beside "Data: StatsBomb.".


[report]
dev_label = "wyniki rozwojowe"
confirmatory_label = "wynik testu"
# Design constants and names, not results: the -400/-800 ms frame offsets and the SHA-256 header.
untagged = ["400 ms", "800 ms", "SHA-256"]

[folders]
sw = { path = "results/sweep_2026_10" }
sb = { path = "results/sweep_2026_10/statsbomb" }
fs = { path = "results/sweep_feet_2026_10" }
ed = { path = "results/err_decomp" }
sr = { path = "results/sweep_report" }
lk = { path = "results/xgs_stack_dd2c_leak" }
d0 = { path = "results/xgs_stack_dd2c", dev = true }
d1 = { path = "results/xgs_stack_feet", dev = true }
d2 = { path = "results/xgs_stack_feet_t0", dev = true }
d3 = { path = "results/xgs_stack_feet_t0_flags", dev = true }

