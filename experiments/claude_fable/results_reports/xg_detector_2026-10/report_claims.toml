# Sources of every number in REPORT.md (xg-detector 07), the final report of the study.
# Checked by scripts/check_xgd_audit.py (which runs scripts/check_vendor_report.py); see both docstrings.
# Paths are relative to experiments/claude_fable. "alias:file" resolves through [folders].
# Folders with dev = true hold development results (out-of-fold on the 328 training matches, and the power computed
# from them): their claims must stand under a heading with "wyniki rozwojowe". The folder with confirmatory = true holds
# the single test: its claims must stand under a heading with "wynik testu" and under none with the development label.

[report]
dev_label = "wyniki rozwojowe"
confirmatory_label = "wynik testu"
# Design constants, not results: the keypoint model's training input size, the study and fallback offsets, and the
# frame resolution of the study and the name of the hash in the source table.
untagged = ["640 × 640", "1280 na 720", "400 ms", "800 ms", "SHA-256"]

[folders]
pl = { path = "results/xgv_split_plan" }
au = { path = "results/xgd_audit" }
a2 = { path = "results/xgd_audit2" }
dg = { path = "results/xgd_audit2_diag" }
hd = { path = "results/xgd_homography_dev" }
hl = { path = "results/xgd_homography_dev/labels" }
rf = { path = "results/xgd_report_figures" }
gt = { path = "results/xgd_gcombo_test" }
ap = { path = "results/xgd_approach1", dev = true }
en = { path = "results/xgd_a1_ensemble", dev = true }
rp = { path = "results/xgd_a1", dev = true }
pw = { path = "results/xgd_test_power", dev = true }
ts = { path = "results/xgd_test", confirmatory = true }

[claims]
