# Sources of every number in AUDIT.md (xg-detector 02).
# Checked by scripts/check_xgd_audit.py (which runs scripts/check_vendor_report.py); see both docstrings.
# Paths are relative to experiments/claude_fable. "alias:file" resolves through [folders].

[report]
dev_label = "wyniki rozwojowe"
confirmatory_label = "wyniki konfirmacyjne"
# Design constants, not results: the declared detector input sizes, the study and fallback offsets, the timing-residual
# bins of timing.csv, and the name of the hash in the source table.
untagged = ["640", "1920", "400 ms", "800 ms", "50 ms", "200 ms", "105 × 68", "x = 105", "68 − y", "SHA-256"]

[folders]
au = { path = "results/xgd_audit" }
kd = { path = "results/xgd_kp_diag" }
fu = { path = "results/xgd_full" }
fc = { path = "cache/xgd_full/C4" }
x1 = { path = "cache/xgd_extract/C1" }
x3 = { path = "cache/xgd_extract/C3" }
x4 = { path = "cache/xgd_extract/C4" }

[claims]
"au.shots" = { src = "au:complete.json", keys = ["population.shots"], fmt = "{:,d}" }
"au.matches" = { src = "au:complete.json", keys = ["population.matches"], fmt = "{:d}" }
"au.ff" = { src = "au:complete.json", keys = ["population.with_freeze_frame"], fmt = "{:,d}" }
"au.sbgk" = { src = "au:complete.json", keys = ["population.with_statsbomb_goalkeeper"], fmt = "{:,d}" }
"au.ci" = { src = "xgpoc/detector/audit.py", quote = "95% percentile intervals of a match bootstrap", values = [95], fmt = "{:d}%" }
"au.n_boot" = { src = "au:complete.json", keys = ["parameters.n_boot"], fmt = "{:,d}" }
"au.kp" = { src = "au:complete.json", keys = ["parameters.kp_strict"], fmt = "{:.1f}" }
"au.cov_min" = { src = "au:complete.json", keys = ["parameters.coverage_min"], scale = 100, fmt = "{:.0f}%" }
"au.med_max" = { src = "au:complete.json", keys = ["parameters.median_max_m"], fmt = "{:.0f} m" }
"au.gk_min" = { src = "au:complete.json", keys = ["parameters.gk_coverage_min"], scale = 100, fmt = "{:.0f}%" }
"au.gate" = { src = "au:choice.json", keys = ["gate.result"], fmt = "{}" }
"au.chosen" = { src = "au:choice.json", keys = ["chosen"], fmt = "{}" }
"au.g.cov" = { src = "au:choice.json", keys = ["gate.checks.shot_location_coverage.value"], scale = 100, fmt = "{:.1f}%" }
"au.g.med" = { src = "au:choice.json", keys = ["gate.checks.shot_location_median_m.value"], fmt = "{:.1f} m" }
"au.g.gk" = { src = "au:choice.json", keys = ["gate.checks.gk_information_coverage.value"], scale = 100, fmt = "{:.1f}%" }
"au.c1.cov" = { src = "au:metrics.csv", row = { config = "C1", quantity = "shot_location", subset = "all", stat = "coverage" }, cols = ["value", "lo", "hi"], fmt = "{:.1f}% [{:.1f}; {:.1f}]", scale = 100 }
"au.c1.median" = { src = "au:metrics.csv", row = { config = "C1", quantity = "shot_location", subset = "all", stat = "median" }, cols = ["value", "lo", "hi"], fmt = "{:.1f} m [{:.1f}; {:.1f}]" }
