# Sources of every number in REPORT.md (xg-temporal 05), the closing report of the xg-temporal phase.
# Checked by scripts/check_xgd_audit.py (which runs scripts/check_vendor_report.py); see both docstrings.
# Paths are relative to experiments/claude_fable. "alias:file" resolves through [folders].
# The phase closed before any label was read: every source is label-free (synthetic outcomes, frame masks, model
# logits, AI timing answers). No folder is a development result on labels (dev = false) and none is confirmatory.

[report]
# Design constants and names, not results: the window's frame offsets, the PCA size, the motion block sizes of the
# earlier designs, the held-out match count, the k sensitivities, the hash name.
untagged = ["−1600", "−1400", "−1200", "−1000", "−800", "−600", "−400", "−200", "+400", "200 ms", "PCA-32",
            "96 kolumn", "172 mecz", "k = 16", "k = 64", "SHA-256"]

[folders]
c1 = { path = "results/xgt/controls/label_free" }
c2 = { path = "results/xgt/controls/label_free_remedy" }
c3 = { path = "results/xgt/controls/label_free_c10" }
rp = { path = "results/xgt_report" }
sm = { path = "results/xgt_safe_margin" }
em = { path = "results/xgt_xgv_embeddings" }
iv = { path = "results/xgt_inputs_xgv" }

[claims]

# --- population and inputs (tickets 01, 01b) ---
"pop.shots" = { src = "iv:summary.json", keys = ["sources.g_xgv.main_population.shots"], fmt = "{:,d}" }
"pop.matches" = { src = "iv:summary.json", keys = ["sources.g_xgv.main_population.matches"], fmt = "{:d}" }
"pop.complete" = { src = "iv:summary.json", keys = ["sources.g_xgv.main_population.complete_shots"], fmt = "{:,d}" }
"pop.base" = { src = "iv:summary.json", keys = ["base.shots"], fmt = "{:,d}" }
"pop.pca32" = { src = "iv:summary.json", keys = ["sources.g_xgv.pca_explained_variance.mean.32"], fmt = "{:.3f}" }
"pop.xg" = { src = "rp:readings.json", keys = ["population.expected_goals"], fmt = "{:.0f}" }
"pop.xgrate" = { src = "rp:readings.json", keys = ["population.expected_goal_rate"], scale = 100, fmt = "{:.1f}%" }
"pop.spm" = { src = "rp:readings.json", keys = ["population.shots_per_match"], fmt = "{:.1f}" }
"em.frames" = { src = "em:complete.json", keys = ["summary.frames_scored"], fmt = "{:,d}" }
"em.sec" = { src = "em:complete.json", keys = ["summary.seconds_this_run"], fmt = "{:,.0f}" }
"em.gpu" = { src = "em:complete.json", keys = ["summary.gpu_peak_allocated_bytes"], scale = 1e-9, fmt = "{:.2f}" }
"em.d0" = { src = "em:complete.json", keys = ["spot_check.offset0_vs_z_g_combo.mean_abs_dlogit"], fmt = "{:.3f}" }
"em.d0.max" = { src = "em:complete.json", keys = ["spot_check.offset0_vs_z_g_combo.max_abs_dlogit"], fmt = "{:.2f}" }
"em.r" = { src = "em:complete.json", keys = ["spot_check.offset0_vs_z_g_combo.pearson_r"], fmt = "{:.3f}" }
"em.d0.n" = { src = "em:complete.json", keys = ["spot_check.offset0_vs_z_g_combo.shots"], fmt = "{:,d}" }
"em.jpeg.n" = { src = "em:complete.json", keys = ["spot_check.index_jpeg_control.shots"], fmt = "{:d}" }
"em.roles" = { src = "em:complete.json", keys = ["spot_check.roles.match_roles.training"], fmt = "{:d}" }

