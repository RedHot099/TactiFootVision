# Sources of every number in results.md (xg-dino 08), the Polish report of the xg-dino phase and the reply to the
# reviewer (points 1-3). Checked by scripts/check_xgd_audit.py (which runs scripts/check_vendor_report.py); see both
# docstrings for the tag and claim scheme. Paths are relative to experiments/claude_fable; "alias:file" resolves
# through [folders].
# Every xg-dino result is a development result on the 328 training matches or a descriptive reading on the 2,721
# paired shots of the spent held-out matches (dev = true): the report's title carries "wyniki rozwojowe", so every
# heading below it does. No folder is confirmatory: no test was run in this phase.
# Earlier phases' numbers (sweep, xg-stack, xg-vendor, xg-detector) are cited from their own source files, without
# their confirmatory flag: here they are background, not results of this phase.
# The report folder (rp) holds counts and ratios read from the tickets' outputs after the runs
# (scripts/xgdino_report.py).

[report]
# Design constants and names, not results: frame offsets and timing-band edges in ms, the ten G-combo tails, DINOv2
# block indices (blocks 0-19 shared, 20-23 fine-tuned, 24 blocks in all), the hash name.
untagged = ["batch 16", "400 ms", "50 ms", "200 ms", "10 ogon", "1 ogon", "0–19", "20–23", "22–23", "bloku 20", "blok 20", "bloku 11", "bloku 23", "bloku 22", "24 bloków", "SHA-256"]

[folders]
ab = { path = "results/xgdino_ablation/real", dev = true }
ct = { path = "results/xgdino_ablation/controls_r2000", dev = true }
tm = { path = "results/xgdino_timing", dev = true }
pl = { path = "results/xgdino_probes_layers", dev = true }
ag = { path = "results/xgdino_agreement", dev = true }
rp = { path = "results/xgdino_report", dev = true }
pr = { path = "research" }
sw = { path = "results/sweep_2026_10" }
fs = { path = "results/sweep_feet_2026_10" }
xs = { path = "results/xgs_stack/real" }
h2 = { path = "results/xgv_confirmatory/ladder" }
h3 = { path = "results/xgv_confirmatory/probes" }
vr = { path = "results/xgv_confirmatory" }
