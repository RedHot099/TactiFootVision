# Sources of every number in info.md (ticket 16), the Polish report of xg-dino-info and the addendum to the reviewer
# reply. Checked by scripts/check_xgd_audit.py (which runs scripts/check_vendor_report.py); see both docstrings for the
# tag and claim scheme. Paths are relative to experiments/claude_fable; "alias:file" resolves through [folders].
# Every result is a development result on the 328 training matches (dev = true): the report's title carries
# "wyniki rozwojowe", so every heading below it does. No folder is confirmatory.
# xg-dino's ablation numbers (ab) are the frozen baseline this phase builds on. The report folder (ir) holds a ratio
# read from the outputs after the runs (scripts/xgdino_info_report.py).

[report]
# Design constants, not results: frame offsets, the +300 ms flag window, the caption window edge, DINOv2 block indices,
# the 95th-percentile rule name, the hash name.
untagged = ["400 ms", "300 ms", "60 s", "20–23", "blok 23", "95. percentyl", "SHA-256"]

[folders]
pr = { path = "research" }
ab = { path = "results/xgdino_ablation/real", dev = true }
at = { path = "results/xgdino_info_attributes", dev = true }
lb = { path = "results/xgdino_info_labels", dev = true }
ct = { path = "results/xgdino_info_protocol/controls_r1000", dev = true }
pb = { path = "results/xgdino_info_probes", dev = true }
rd = { path = "results/xgdino_info_redundancy", dev = true }
ms = { path = "results/xgdino_info_masked", dev = true }
mk = { path = "results/xgdino_info_mask", dev = true }
ir = { path = "results/xgdino_info_report", dev = true }

[claims]

# --- pinned protocols (xg-dino 01b; ticket 11) ---
"p.shots" = { src = "pr:xgdino_ablation_protocol.json", keys = ["frozen.population.expected.primary.shots"], fmt = "{:,d}" }
"p.matches" = { src = "pr:xgdino_ablation_protocol.json", keys = ["frozen.population.expected.primary.matches"], fmt = "{:d}" }
"p.goals" = { src = "pr:xgdino_ablation_protocol.json", keys = ["frozen.population.expected_goals.primary"], fmt = "{:d}" }
"p.nov3.shots" = { src = "pr:xgdino_ablation_protocol.json", keys = ["frozen.population.expected.no_v3.shots"], fmt = "{:,d}" }
"p.unseen.shots" = { src = "pr:xgdino_ablation_protocol.json", keys = ["frozen.population.expected.unseen.shots"], fmt = "{:,d}" }
"p.draws" = { src = "pr:xgdino_info_protocol.json", keys = ["frozen.model.bootstrap.draws"], fmt = "{:,d}" }
"p.gain.r2" = { src = "pr:xgdino_ablation_protocol.json", keys = ["frozen.encodes_thresholds.encodes_beyond_distance.delta_r2_min"], fmt = "{:.2f}" }
"p.gain.auc" = { src = "pr:xgdino_ablation_protocol.json", keys = ["frozen.encodes_thresholds.encodes_beyond_distance.delta_auc_min"], fmt = "{:.2f}" }
"p.ci95" = { src = "pr:xgdino_ablation_protocol.json", quote = "95% match-bootstrap lower bound > 0", values = [95], fmt = "{:d}%" }
"p.held" = { src = "pr:xgs_stack_protocol_c6.json", quote = "the 172 held-out matches (135 evaluation, 37 gate)", values = [172], fmt = "{:d}" }
"pr.most" = { src = "pr:xgdino_info_protocol.json", quote = "the 5th percentile of R - 0.5 G > 0", values = [0.5], fmt = "{:.1f}" }
"pr.part" = { src = "pr:xgdino_info_protocol.json", quote = "the same with R - 0.25 G", values = [0.25], fmt = "{:.2f}" }
"pr.minsup" = { src = "pr:xgdino_info_protocol.json", keys = ["frozen.subgroups.min_support"], fmt = "{:d}" }

# --- xg-dino baseline (ticket 02) and the report ratio ---
"ab.C-B.ll" = { src = "ab:summary.json", keys = ["blocks.primary.contrasts.C-B.log_loss.delta", "blocks.primary.contrasts.C-B.log_loss.lo95", "blocks.primary.contrasts.C-B.log_loss.hi95"], fmt = "{:+.4f} [{:+.4f}; {:+.4f}]" }
"ab.BQ-B.ll" = { src = "ab:summary.json", keys = ["blocks.primary.contrasts.BQ-B.log_loss.delta", "blocks.primary.contrasts.BQ-B.log_loss.lo95", "blocks.primary.contrasts.BQ-B.log_loss.hi95"], fmt = "{:+.4f} [{:+.4f}; {:+.4f}]" }
"ir.bqshare" = { src = "ir:derived.json", keys = ["bq_minus_b_share_of_c_minus_b"], scale = 100, fmt = "{:.0f}%" }

# --- attributes (ticket 09) ---
"at.replay" = { src = "at:coverage.json", keys = ["replay_reproduces_shot_xy.0.reproduced"], fmt = "{:,d}" }
"at.motion" = { src = "at:coverage.json", keys = ["motion_status.ok"], fmt = "{:,d}" }

