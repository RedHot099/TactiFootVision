"c3.avail" = { src = "research/quality_v13_decisions.tsv", quote = "availability >= 0.85, median <= 1.0 m, p90 <= 3 m, refinement mask from the package detector", values = [0.85], scale = 100, fmt = "{:.0f}%" }
"c3.med" = { src = "research/quality_v13_decisions.tsv", quote = "availability >= 0.85, median <= 1.0 m, p90 <= 3 m, refinement mask from the package detector", values = [1.0], fmt = "{:.1f} m" }
"c3.budget" = { src = "research/quality_v13_decisions.tsv", quote = "stop at the first of 3 model families, 30 GPU-hours", values = [30], fmt = "{:d}" }
"pl.heldout" = { src = "research/xg_detector_test_rule.json", keys = ["population.matches"], fmt = "{:d}" }

