# Sources of every number in REPORT.md (pitch-keypoints 06), the report of the pitch-keypoints phase.
# Checked by scripts/check_xgd_audit.py (which runs scripts/check_vendor_report.py); see both docstrings.
# Paths are relative to experiments/claude_fable. "alias:file" resolves through [folders].
# Folders with dev = true hold the choice on the validation splits (GSR valid, Calibration valid): their claims must
# stand under a heading with "wyniki rozwojowe". Folders with confirmatory = true hold the single scoring of the chosen
# model on GSR test and Calibration-2023 test: their claims must stand under a heading with "wynik testu" and under
# none with the development label. The baseline's own scoring on GSR test (ticket 02) is a reference, not the test.

[report]
dev_label = "wyniki rozwojowe"
confirmatory_label = "wynik testu"
# Design constants and names, not results: the model's input size and the stride-padded input it was compared with,
# the stored image size, the 32 pitch vertices, the study frame offsets, GSR game ids, Polish ticket references, the
# hash name in the source table.
untagged = ["960 × 544", "960 × 540", "960", "32 wierzchołki", "400 ms", "800 ms", "mecz 11", "tickecie 03",
            "tickecie 04", "tickecie 08", "SHA-256", "Calibration-2023"]

[folders]
ds = { path = "results/pk_dataset" }
bv = { path = "results/pitchkp_gsr_eval/valid" }
bt = { path = "results/pitchkp_gsr_eval/test" }
bcv = { path = "results/pitchkp_gsr_eval/calib_valid" }
bct = { path = "results/pitchkp_gsr_eval/calib_test" }
lb = { path = "results/pk_candidates/y11m_960_e18/valid", dev = true }
cv = { path = "results/pk_candidates/y11m_960_e18_square/valid", dev = true }
ccv = { path = "results/pk_candidates/y11m_960_e18_square/calib_valid", dev = true }
rt = { path = "results/pk_candidates/y11m_960_e18_square/retune_valid", dev = true }
ct = { path = "results/pk_candidates/y11m_960_e18_square/test", confirmatory = true }
cct = { path = "results/pk_candidates/y11m_960_e18_square/calib_test", confirmatory = true }
lf = { path = "results/pk_label_free/y11m_960_e18_square" }
hl = { path = "results/xgd_homography_dev/labels" }
rf = { path = "results/xgd_report_figures" }
sq = { path = "results/pk_square_input" }
ev = { path = "results/pk_ball_evidence" }
a1 = { path = "results/xgd_audit" }
a2 = { path = "results/xgd_audit2" }
a3 = { path = "results/xgd_audit3" }
dg2 = { path = "results/xgd_audit2_diag" }
dg3 = { path = "results/xgd_audit3_diag" }
fu3 = { path = "results/xgd_full3" }

[claims]

