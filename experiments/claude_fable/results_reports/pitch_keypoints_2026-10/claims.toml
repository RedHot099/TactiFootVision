# Sources of every number in AUDIT3.md (pitch-keypoints 04). Checked by
# scripts/check_xgd_audit.py (scripts/check_vendor_report.py). Paths are relative to experiments/claude_fable; "alias:file" resolves through [folders].

[report]
dev_label = "wyniki rozwojowe"
confirmatory_label = "wyniki konfirmacyjne"
# Design constants, not results: input sizes, the offsets of the study frames, the timing-residual bins, names.
untagged = ["960", "1920", "400 ms", "800 ms", "50 ms", "200 ms", "SHA-256", "Calibration-2023", "tickecie 03"]

[folders]
a1 = { path = "results/xgd_audit" }
a3 = { path = "results/xgd_audit3" }
dg2 = { path = "results/xgd_audit2_diag" }
dg3 = { path = "results/xgd_audit3_diag" }
ev = { path = "results/pk_ball_evidence" }
sq = { path = "results/pk_square_input" }
t3 = { path = "results/pk_candidates/y11m_960_e18_square/retune_valid" }
t2 = { path = "results/pitchkp_gsr_eval/valid" }
fu3 = { path = "results/xgd_full3" }
fc3 = { path = "cache/xgd_full3/E3" }

