# Sources of every number in REPORT.md (xg-stack 03), the report of the xg-stack phase.
# Checked by scripts/check_xgd_audit.py (which runs scripts/check_vendor_report.py); see both docstrings.
# Paths are relative to experiments/claude_fable. "alias:file" resolves through [folders].
# Every xg-stack result is a development result on the 328 training matches (dev = true): the report's title carries
# "wyniki rozwojowe", so every heading below it does. No folder is confirmatory: no test was run.
# The xg-compare folder (xc) holds the StatsBomb-based numbers the report compares with; they stand beside
# "Data: StatsBomb." in the text.
# The report folder (rp) holds the power on the 172 matches, descriptive, added after the run (scripts/xgs_report.py).

[report]
# Design constants and names, not results: the -400 ms frame offset, the 20 s corner window name, the 15° angle
# category name, the hash name.
untagged = ["400 ms", "20 s", "15°", "SHA-256"]

[folders]
rl = { path = "results/xgs_stack/real", dev = true }
ct = { path = "results/xgs_stack/controls", dev = true }
c5 = { path = "results/xgs_stack/c5_controls", dev = true }
se = { path = "results/xgs_stack/selection", dev = true }
rp = { path = "results/xgs_stack/report", dev = true }
xc = { path = "results/xgc_compare/analysis" }

[claims]

