# Sources of every number in TEST.md (xg-stack 04), the report of the owner-ordered test on the 172 held-out matches.
# Checked by scripts/check_xgd_audit.py (which runs scripts/check_vendor_report.py); see both docstrings.
# Paths are relative to experiments/claude_fable. "alias:file" resolves through [folders].
# Test results (ts, tc: confirmatory = true) stand under headings with "wynik testu", never under "wyniki rozwojowe".
# The preparation (ck) and the before-scoring readings (pb) were written before any test label was read; pb and ts
# are the same folder (results/xgs_test_report), split by file: before_scoring.json and readings.json.
# The development run (dv) stands under a "wyniki rozwojowe" heading, as do the development inputs of the power.
# The StatsBomb look (sb, and ts's statsbomb block) stands beside "Data: StatsBomb.".

[report]
dev_label = "wyniki rozwojowe"
confirmatory_label = "wynik testu"
# Design constants and names, not results: the -400 ms frame offset, the 20 s corner window, the 15° angle category,
# the factor 100 of the xG-point gap.
untagged = ["400 ms", "20 s", "15°", "SHA-256", "100 ×"]

[folders]
ts = { path = "results/xgs_test_report", confirmatory = true }
pb = { path = "results/xgs_test_report" }
tc = { path = "results/xgs_test", confirmatory = true }
ck = { path = "results/xgs_test_prep" }
sb = { path = "results/xgs_test_statsbomb", confirmatory = true }
dv = { path = "results/xgs_stack/real", dev = true }

[claims]

