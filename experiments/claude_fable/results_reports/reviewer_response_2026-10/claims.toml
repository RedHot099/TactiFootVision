# Sources of every number in REPORT.md and reply.md (xg-credibility 14).
# Checked by scripts/check_reviewer_report.py; see its docstring for the scheme.
# Paths are relative to experiments/claude_fable. "alias:file" resolves through [folders].

[report]
dev_label = "wyniki rozwojowe"

[folders]
p1 = { path = "results_reports/ensemble_vs_g_2026-10", dev = true }
rd = { path = "results_reports/readability_2026-10", dev = true }
pc = { path = "results_reports/post_contact_share_2026-10", dev = true }
tr = { path = "results_reports/transfer_2026-10", dev = true }
g = { path = "results/xgc_g_combo", dev = true }
g0 = { path = "results/xgc_g_combo_no_head", dev = true }
os = { path = "results/xgc_offset_scores", dev = true }
res = { path = "research", dev = false }

[reply]
claims = [
    "p1.ll", "p1.brier", "p1.games", "p1.margin_ll", "p1.margin_brier", "p1.margin_ll_share",
    "p1.margin_brier_share", "p1.slope_g10_1d", "p1.slope_diff_plain",
    "pc.shots", "rd.auc_f800_point", "pc.u_g", "p1.slope_g10_2d", "p1.attr_slope_earliest_2d",
    "tr.gap", "tr.rel_short", "proto.t_k",
]

[claims]
# Protocols: the file as committed at the approved revision, and the hash in the result records.
"proto.probe.git" = { src = "res:xgc_direction_probe_protocol.md", git = "41dfd12", fmt = "{:.12}" }
"proto.probe.record" = { src = "pc:complete.json", keys = ["protocol_sha256"], fmt = "{:.12}", dev = false }
"proto.transfer.git" = { src = "res:xgc_transfer_protocol.md", git = "07dc33f", fmt = "{:.12}" }
"proto.transfer.record" = { src = "tr:complete.json", keys = ["protocol_sha256"], fmt = "{:.12}", dev = false }

# Constants fixed by the direction-probe protocol (quoted from its text).
"proto.ci95" = { src = "res:xgc_direction_probe_protocol.md", quote = "Przedziały percentylowe 95%", values = [95], fmt = "{:d}%" }
"proto.ai_n" = { src = "res:xgc_direction_probe_protocol.md", quote = "Na 17 strzałach z przedziałem kontaktu", values = [17], fmt = "{:d}" }
"proto.ai_after" = { src = "res:xgc_direction_probe_protocol.md", quote = "po przedziale 3 razy", values = [3], fmt = "{:d}" }
"proto.half_width" = { src = "res:xgc_direction_probe_protocol.md", quote = "połowa szerokości przedziału 95% U_F ≤ 0,15", values = [0.15], fmt = "{:.2f}" }
"proto.ka_ratio" = { src = "res:xgc_direction_probe_protocol.md", quote = "0,5 ≤ A / A_pred ≤ 1,5", values = [0.5, 1.5], fmt = "{:.1f} ≤ A/A_pred ≤ {:.1f}" }
"proto.leak" = { src = "res:xgc_direction_probe_protocol.md", quote = "Dolna granica U_F > 0,10", values = [0.10], fmt = "{:.2f}" }
"proto.placebo" = { src = "res:xgc_direction_probe_protocol.md", quote = "|π(o)| > 0,10", values = [0.10], fmt = "{:.2f}" }
"proto.neg" = { src = "res:xgc_direction_probe_protocol.md", quote = "przekracza 0,10·Δ_F", values = [0.10], fmt = "{:.2f}·Δ_F" }
"proto.sim_auc" = { src = "res:xgc_direction_probe_protocol.md", quote = "AUC 0,69–0,70", values = [0.69, 0.70], fmt = "{:.2f}–{:.2f}" }
"proto.eff_u" = { src = "res:xgc_direction_probe_protocol.md", quote = "U ≈ 0,37 przy rzeczywistym odsetku klatek po kontakcie 0,50", values = [0.37], fmt = "{:.2f}" }
"proto.eff_true" = { src = "res:xgc_direction_probe_protocol.md", quote = "U ≈ 0,37 przy rzeczywistym odsetku klatek po kontakcie 0,50", values = [0.50], fmt = "{:.2f}" }
"proto.windup" = { src = "res:xgc_direction_probe_protocol.md", quote = "zawyża U o 0,04–0,17", values = [0.04, 0.17], fmt = "{:.2f}–{:.2f}" }

# Design constants fixed by the transfer protocol.
"proto.t_matches" = { src = "res:xgc_transfer_protocol.md", quote = "uczy się na 300 meczach z puli", values = [300], fmt = "{:d}" }
"proto.t_fits" = { src = "res:xgc_transfer_protocol.md", quote = "2 ziarna = 40 treningów", values = [40], fmt = "{:d}" }
"proto.t_seasons" = { src = "res:xgc_transfer_protocol.md", quote = "sezony 2014–2017", values = [2014, 2017], fmt = "{:d}–{:d}" }
"proto.t_k" = { src = "res:xgc_transfer_protocol.md", quote = "k ∈ {0, 5, 10, 20}", values = [5, 20], fmt = "{:d}–{:d}" }

# Point 1 (ticket 02, attribution: ticket 03). Archived fold predictions, official test v1.2.
"p1.n_test" = { src = "p1:summary.json", keys = ["n_test"], fmt = "{:,d}" }
"p1.games" = { src = "p1:summary.json", keys = ["games"], fmt = "{:d}" }
"p1.auc" = { src = "p1:headline_ens_vs_g10.csv", row = { a = "ens", b = "g10" }, cols = ["d_auc", "d_auc_lo", "d_auc_hi"], fmt = "{:+.4f} [{:+.4f}; {:+.4f}]" }
"p1.ll" = { src = "p1:headline_ens_vs_g10.csv", row = { a = "ens", b = "g10" }, cols = ["d_log_loss", "d_log_loss_lo", "d_log_loss_hi"], fmt = "{:+.4f} [{:+.4f}; {:+.4f}]" }
"p1.brier" = { src = "p1:headline_ens_vs_g10.csv", row = { a = "ens", b = "g10" }, cols = ["d_brier", "d_brier_lo", "d_brier_hi"], fmt = "{:+.5f} [{:+.5f}; {:+.5f}]" }
"p1.margin_ll" = { src = "p1:summary.json", keys = ["equivalence.log_loss.smallest_margin_most_draws"], fmt = "{:.4f}" }
"p1.margin_brier" = { src = "p1:summary.json", keys = ["equivalence.brier.smallest_margin_most_draws"], fmt = "{:.4f}" }
"p1.margin_ll_range" = { src = "p1:summary.json", keys = ["equivalence.log_loss.smallest_margin_range_over_seeds.0", "equivalence.log_loss.smallest_margin_range_over_seeds.1"], fmt = "{:.4f}–{:.4f}" }
"p1.margin_brier_range" = { src = "p1:summary.json", keys = ["equivalence.brier.smallest_margin_range_over_seeds.0", "equivalence.brier.smallest_margin_range_over_seeds.1"], fmt = "{:.4f}–{:.4f}" }
"p1.margin_ll_share" = { src = "p1:summary.json", keys = ["equivalence.log_loss.smallest_margin_most_draws_share_of_skill"], scale = 100, fmt = "{:.1f}%" }
"p1.margin_brier_share" = { src = "p1:summary.json", keys = ["equivalence.brier.smallest_margin_most_draws_share_of_skill"], scale = 100, fmt = "{:.1f}%" }
"p1.seed_gap_ll" = { src = "p1:summary.json", keys = ["equivalence.log_loss.g5_seed_gap"], fmt = "{:.5f}" }
"p1.seed_gap_brier" = { src = "p1:summary.json", keys = ["equivalence.brier.g5_seed_gap"], fmt = "{:.5f}" }
"p1.seed_gap_ll_ci" = { src = "p1:summary.json", keys = ["equivalence.log_loss.g5_seed_gap_ci95.0", "equivalence.log_loss.g5_seed_gap_ci95.1"], fmt = "[{:+.4f}; {:+.4f}]" }
"p1.skill_ll" = { src = "p1:summary.json", keys = ["equivalence.log_loss.skill"], fmt = "{:.4f}" }
"p1.ms_g10" = { src = "p1:summary.json", keys = ["timing.configurations_fp32.g10.shared_ms"], fmt = "{:.1f}", dev = false }
"p1.ms_ens" = { src = "p1:summary.json", keys = ["timing.configurations_fp32.ens.shared_ms", "timing.configurations_fp32.ens.naive_ms"], fmt = "{:.1f}–{:.1f}", dev = false }
"p1.slope_g10" = { src = "p1:calibration.csv", row = { variant = "g10" }, cols = ["slope", "slope_lo", "slope_hi"], fmt = "{:.2f} [{:.2f}; {:.2f}]" }
"p1.slope_g10_1d" = { src = "p1:calibration.csv", row = { variant = "g10" }, cols = ["slope"], fmt = "{:.1f}" }
"p1.slope_g10_2d" = { src = "p1:calibration.csv", row = { variant = "g10" }, cols = ["slope"], fmt = "{:.2f}" }
"p1.slope_ens" = { src = "p1:calibration.csv", row = { variant = "ens" }, cols = ["slope", "slope_lo", "slope_hi"], fmt = "{:.2f} [{:.2f}; {:.2f}]" }
"p1.slope_diff" = { src = "p1:calibration_diff.csv", row = { quantity = "slope" }, cols = ["diff", "lo", "hi"], fmt = "{:+.3f} [{:+.3f}; {:+.3f}]" }
"p1.slope_diff_plain" = { src = "p1:calibration_diff.csv", row = { quantity = "slope" }, cols = ["diff", "lo", "hi"], fmt = "{:.3f} [{:.3f}; {:.3f}]" }
"p1.ece_diff" = { src = "p1:calibration_diff.csv", row = { quantity = "ece" }, cols = ["diff", "lo", "hi"], fmt = "{:+.4f} [{:+.4f}; {:+.4f}]" }
"p1.low30_pct" = { src = "p1:REPORT.md", quote = "Najniższe 30% prognoz G-combo to 659 strzałów", values = [30], fmt = "{:d}%" }
"p1.low30_shots" = { src = "p1:summary.json", keys = ["g10_lowest_30pct.shots"], fmt = "{:d}" }
