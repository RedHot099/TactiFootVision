"p1.low30_xg" = { src = "p1:summary.json", keys = ["g10_lowest_30pct.sum_xg"], fmt = "{:.1f}" }
"p1.split_half" = { src = "p1:summary.json", keys = ["recalibration.g10.split_half.gain_logistic.mean"], fmt = "{:+.4f}" }
"p1.split_half_share" = { src = "p1:summary.json", keys = ["recalibration.g10.split_half.gain_logistic.share_positive"], scale = 100, fmt = "{:.0f}%" }
"p1.g5_vs_g10" = { src = "p1:ladder_vs_g10.csv", row = { rung = "g5" }, cols = ["d_log_loss", "d_log_loss_lo", "d_log_loss_hi"], fmt = "{:+.4f} [{:+.4f}; {:+.4f}]" }
"p1.attr_ll_worst" = { src = "p1:attribution_sensitivity.csv", row = { rule = "worst for ens vs g10" }, cols = ["d_log_loss"], fmt = "{:+.4f}" }
"p1.attr_ll_best" = { src = "p1:attribution_sensitivity.csv", row = { rule = "best for ens vs g10" }, cols = ["d_log_loss"], fmt = "{:+.4f}" }
"p1.attr_ll_best_ci" = { src = "p1:attribution_sensitivity.csv", row = { rule = "best for ens vs g10" }, cols = ["d_log_loss_lo", "d_log_loss_hi"], fmt = "[{:+.4f}; {:+.4f}]" }
"p1.attr_slope_earliest" = { src = "p1:attribution_sensitivity.csv", row = { rule = "earliest" }, cols = ["slope_g10", "slope_g10_lo", "slope_g10_hi"], fmt = "{:.2f} [{:.2f}; {:.2f}]" }
"p1.attr_slope_earliest_1d" = { src = "p1:attribution_sensitivity.csv", row = { rule = "earliest" }, cols = ["slope_g10"], fmt = "{:.1f}" }
"p1.attr_slope_earliest_2d" = { src = "p1:attribution_sensitivity.csv", row = { rule = "earliest" }, cols = ["slope_g10"], fmt = "{:.2f}" }
"p1.chains" = { src = "p1:attribution_recount.csv", row = { split = "test" }, cols = ["chains"], fmt = "{:d}" }
"p1.chain_shots" = { src = "p1:attribution_recount.csv", row = { split = "test" }, cols = ["chain_shots"], fmt = "{:d}" }
"p1.chain_goals" = { src = "p1:attribution_recount.csv", row = { split = "test" }, cols = ["chain_goals"], fmt = "{:d}" }
"p1.test_goals" = { src = "p1:attribution_recount.csv", row = { split = "test" }, cols = ["goals"], fmt = "{:d}" }

# Retrained G-combo (ticket 04) and the head-free control (ticket 05); git-ignored result folders.
"g.gate_ll" = { src = "g:gate.json", keys = ["metrics.log_loss.retrained"], fmt = "{:.4f}" }
"g.gate_ll_archived" = { src = "g:gate.json", keys = ["metrics.log_loss.archived"], fmt = "{:.4f}" }
