"g0.ll" = { src = "g0:comparison.csv", row = { metric = "log_loss" }, cols = ["diff_no_head_minus_g_combo", "ci_lo", "ci_hi"], fmt = "{:+.4f} [{:+.4f}; {:+.4f}]" }
"g0.auc" = { src = "g0:comparison.csv", row = { metric = "auc" }, cols = ["diff_no_head_minus_g_combo", "ci_lo", "ci_hi"], fmt = "{:+.4f} [{:+.4f}; {:+.4f}]" }

# Offset scoring checks (ticket 08).
"os.jpeg_tv" = { src = "os:complete.json", keys = ["spot_check.index_jpeg_control.g_combo.train_valid.max_abs_dlogit"], fmt = "{:.5f}" }
"os.jpeg_test" = { src = "os:complete.json", keys = ["spot_check.index_jpeg_control.g_combo.test.max_abs_dlogit"], fmt = "{:.6f}" }
"os.jpeg_tol" = { src = "os:complete.json", keys = ["spot_check.index_jpeg_control.g_combo.tolerance"], fmt = "{:.3f}" }
"os.png_tv" = { src = "os:complete.json", keys = ["spot_check.offset0_vs_stored.g_combo.train_valid.mean_abs_dlogit"], fmt = "{:.3f}" }
"os.png_test" = { src = "os:complete.json", keys = ["spot_check.offset0_vs_stored.g_combo.test.mean_abs_dlogit"], fmt = "{:.3f}" }

# Direction probe: readability curves (ticket 09) and verdict (ticket 10).
"pc.shots" = { src = "pc:summary.json", keys = ["population.shots"], fmt = "{:,d}" }
"pc.matches" = { src = "pc:summary.json", keys = ["population.matches"], fmt = "{:d}" }
