name: ci

on:
  pull_request:
  push:
    branches: [master]

# A new push to the same pull request stops the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_HTTP_TIMEOUT: "300"
  UV_HTTP_RETRIES: "10"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --only-group dev
      - run: uv run ruff check src tests examples notebooks/build
      - run: uv run ruff format --check src tests examples notebooks/build

  fast-suite:
    name: fast suite (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from the git tags
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  build:
    name: build and twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  colab-smoke:
    name: colab smoke (pip, Colab versions)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # pip installs the wheel as in Colab, under the versions the default
      # Colab runtime ships (tests/colab-constraints.txt), so this checks the
      # ranges in pyproject.toml, not the lock. The CPU wheels of torch keep
      # the install small; the versions are the same. The dev tools let the
      # whole fast suite run (notebook build, sdist test).
      - run: uv venv -q -p 3.13 --seed .venv-colab
      - run: >-
          .venv-colab/bin/python -m pip install -q --disable-pip-version-check
          --index-url https://download.pytorch.org/whl/cpu --extra-index-url https://pypi.org/simple
          -c tests/colab-constraints.txt dist/*.whl pytest nbclient nbformat ipykernel hatchling hatch-vcs
      - name: no Colab version downgraded; the package and the team embedder import
        run: |
          .venv-colab/bin/python - <<'PY'
          import importlib.metadata as metadata
          import pathlib

          pins = {}
          for line in pathlib.Path("tests/colab-constraints.txt").read_text().splitlines():
              if "==" in line and not line.startswith("#"):
                  name, version = line.split("==")
                  pins[name.lower().replace("_", "-")] = version
          installed = {d.metadata["Name"].lower().replace("_", "-"): d.version for d in metadata.distributions()}
          differ = {n: (v, installed[n]) for n, v in pins.items() if n in installed and installed[n].split("+")[0] != v}
          assert not differ, f"installed versions differ from the Colab constraints: {differ}"
          import tactifoot_vision as tv
          from transformers import SiglipImageProcessor, SiglipVisionModel

          print("tactifoot-vision", tv.__version__, "imports; Pipeline:", tv.Pipeline.__name__)
          PY
      - run: .venv-colab/bin/tactifoot info
      - run: .venv-colab/bin/python -m pytest -q -p no:cacheprovider tests
