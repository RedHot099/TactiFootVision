name: ci

on:
  pull_request:
  push:
    branches: [master]

env:
  UV_HTTP_TIMEOUT: "300"
  UV_HTTP_RETRIES: "10"

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked --only-group dev
      - run: uv run ruff check src tests examples notebooks/build
      - run: uv run ruff format --check src tests examples notebooks/build

  fast-suite:
    name: fast suite (uv.lock)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from the git tags
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -q

  build:
    name: build and twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  colab-smoke:
    name: colab smoke (pip, Colab versions)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - run: bash scripts/colab-smoke.sh dist/*.whl
