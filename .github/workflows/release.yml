name: release

# The maintainer creates a GitHub Release (which creates the tag vX.Y.Z);
# this builds the distributions, publishes them to TestPyPI, and then to
# PyPI once the maintainer approves the `pypi` environment. Both indexes use
# Trusted Publishing (OIDC), so there are no API tokens: see docs/RELEASING.md.
on:
  release:
    types: [published]

env:
  UV_HTTP_TIMEOUT: "300"
  UV_HTTP_RETRIES: "10"

jobs:
  build:
    name: build and twine check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # the version comes from the release tag
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - run: uvx twine check dist/*
      - name: the built files must carry exactly the release tag's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          test -f "dist/tactifoot_vision-${tag}-py3-none-any.whl" \
            && test -f "dist/tactifoot_vision-${tag}.tar.gz" \
            && [ "$(ls dist | wc -l)" -eq 2 ] \
            || { echo "dist/ does not hold exactly the wheel and sdist of ${tag}:"; ls dist/; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    name: publish to TestPyPI
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: testpypi
      url: https://test.pypi.org/p/tactifoot-vision
    permissions:
      id-token: write  # Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    name: publish to PyPI (after approval)
    runs-on: ubuntu-latest
    needs: testpypi
    environment:
      name: pypi  # requires the maintainer's approval (docs/RELEASING.md)
      url: https://pypi.org/p/tactifoot-vision
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
